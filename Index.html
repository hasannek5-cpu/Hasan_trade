<!DOCTYPE html> <html lang="fa" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>حسن ترید</title> <style> body{font-family:Arial;background:#101827;color:white;text-align:center;padding:20px} .card{background:#1f2d40;padding:20px;border-radius:16px;margin-top:20px} input,button{width:100%;box-sizing:border-box;padding:14px;margin:8px 0;border:0;border-radius:10px;font-size:17px} button{color:white;background:#16a34a;font-weight:bold} .sell{background:#dc2626} p{font-size:18px} </style> </head> <body> <h1>📈 حسن ترید</h1> <p>پنل آزمایشی خرید و فروش ارز دیجیتال</p> <div class="card"> <label>قیمت ارز دیجیتال (دلار)</label> <input id="price" type="number" placeholder="مثلاً 65000"> <label>مبلغ معامله (دلار)</label> <input id="amount" type="number" placeholder="مثلاً 100"> <button onclick="trade('خرید')">خرید آزمایشی</button> <button class="sell" onclick="trade('فروش')">فروش آزمایشی</button> <p id="result">هنوز معامله‌ای انجام نشده است.</p> </div> <script> function trade(type){ let p=Number(document.getElementById('price').value); let a=Number(document.getElementById('amount').value); if(p<=0||a<=0){ document.getElementById('result').textContent='قیمت و مبلغ را درست وارد کن.'; return; } document.getElementById('result').textContent= type+' آزمایشی ثبت شد | قیمت: '+p+' دلار | مبلغ: '+a+' دلار'; } </script> </body> </html>
