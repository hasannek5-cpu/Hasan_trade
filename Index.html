
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حسن ترید</title>
<style>
body{background:#101827;color:white;font-family:tahoma;text-align:center;padding:15px}
.card{background:#1e293b;padding:20px;border-radius:15px;margin:15px 0}
input,button{padding:13px;margin:7px;border:0;border-radius:8px;font-size:16px}
input{width:80%;box-sizing:border-box}
button{color:white;background:#16a34a}
.sell{background:#dc2626}
p{font-size:16px}
</style>
</head>
<body>
<h1>💹 حسن ترید</h1>
<p>قیمت واقعی بازار + معاملات آزمایشی</p>

<div class="card">
<h3>قیمت ارزها</h3>
<div id="realPrices">در حال دریافت قیمت...</div>
<button onclick="loadCryptoPrice()">به‌روزرسانی قیمت</button>
</div>

<div class="card">
<h3>معامله آزمایشی</h3>
<label>قیمت ارز (دلار):</label><br>
<input id="price" type="number" placeholder="قیمت را وارد کن"><br>
<label>مقدار ارز:</label><br>
<input id="amount" type="number" placeholder="مثلاً 0.01"><br>
<button onclick="trade('خرید')">خرید آزمایشی</button>
<button class="sell" onclick="trade('فروش')">فروش آزمایشی</button>
<p id="result">آماده شروع معامله</p>
<p id="balance">موجودی آزمایشی: 10000 دلار</p>
</div>

<div class="card">
<h3>تاریخچه معاملات</h3>
<div id="history">هنوز معامله‌ای انجام نشده</div>
</div>

<script>

<script>
let balance = 10000;

// کلید Demo API کوین‌گکو را اینجا وارد کن
const apiKey = 'YOUR_COINGECKO_API_KEY';

async function loadCryptoPrice() {
  const box = document.getElementById('realPrices');
  box.innerText = 'در حال دریافت قیمت واقعی...';

  try {
    const response = await fetch(
      'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd',
      {
        headers: {
          'x-cg-demo-api-key': apiKey
        }
      }
    );

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    const data = await response.json();

    box.replaceChildren();

    const coins = [
      ['بیت‌کوین', 'bitcoin'],
      ['اتریوم', 'ethereum'],
      ['سولانا', 'solana']
    ];

    coins.forEach(([name, id]) => {
      if (!data[id] || typeof data[id].usd !== 'number') {
        throw new Error('قیمت دریافت نشد');
      }

      const p = document.createElement('p');
      p.textContent = name + ': $' +
        data[id].usd.toLocaleString('en-US');
      box.appendChild(p);
    });

    const time = document.createElement('small');
    time.textContent =
      'آخرین دریافت: ' + new Date().toLocaleTimeString('fa-IR');
    box.appendChild(time);

  } catch (error) {
    box.textContent =
      'دریافت قیمت ناموفق بود. اینترنت، کلید API یا محدودیت درخواست را بررسی کن.';
  }
}

function trade(type) {
  const p = Number(document.getElementById('price').value);
  const a = Number(document.getElementById('amount').value);

  if (!Number.isFinite(p) || !Number.isFinite(a) ||
      p <= 0 || a <= 0) {
    alert('قیمت و مقدار معتبر وارد کن');
    return;
  }

  const total = p * a;

  if (type === 'خرید') {
    if (total > balance) {
      alert('موجودی آزمایشی کافی نیست');
      return;
    }
    balance -= total;
  } else {
    balance += total;
  }

  document.getElementById('result').innerText =
    type + ' آزمایشی: ' + total.toFixed(2) + ' دلار';

  document.getElementById('balance').innerText =
    'موجودی آزمایشی: ' + balance.toFixed(2) + ' دلار';

  const history = document.getElementById('history');

  if (history.innerText === 'هنوز معامله‌ای انجام نشده') {
    history.innerHTML = '';
  }

  const row = document.createElement('p');
  row.textContent = type + ' | قیمت: ' + p +
    ' | مقدار: ' + a + ' | مبلغ: ' +
    total.toFixed(2) + ' دلار';

  history.prepend(row);
}

loadCryptoPrice();
setInterval(loadCryptoPrice, 60000);
</script>

</body>
</html>
