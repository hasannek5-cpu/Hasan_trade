<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حسن ترید</title>
<style>
body{background:#101827;color:white;font-family:tahoma;text-align:center;padding:15px}
.card{background:#1e293b;padding:20px;border-radius:15px;margin:15px 0}
input,button{padding:13px;margin:7px;border:0;border-radius:8px;font-size:16px}
input{width:80%;box-sizing:border-box}
button{color:white;background:#16a34a}
.sell{background:#dc2626}
p{font-size:18px}
</style>
</head>
<body>
<h1>💹 حسن ترید</h1>
<p>پنل آزمایشی خرید و فروش ارز دیجیتال</p>
<div class="card">
<label>قیمت ارز (دلار):</label><br>
<input id="price" type="number" placeholder="مثلاً 65000"><br>
<label>مقدار ارز:</label><br>
<input id="amount" type="number" placeholder="مثلاً 0.01"><br>
<button onclick="trade('خرید')">خرید آزمایشی</button>
<button class="sell" onclick="trade('فروش')">فروش آزمایشی</button>
<p id="result">آماده شروع معامله</p>
<p id="balance">موجودی آزمایشی: 10000 دلار</p>
</div>
<div class="card">
<h3>تاریخچه معاملات</h3>
<div id="history">هنوز معامله‌ای انجام نشده</div>
</div>
<script>
let balance=10000;
function trade(type){
let p=Number(document.getElementById('price').value);
let a=Number(document.getElementById('amount').value);
if(p<=0||a<=0){alert('قیمت و مقدار را درست وارد کن');return}
let total=p*a;
if(type==='خرید'){
if(total>balance){alert('موجودی آزمایشی کافی نیست');return}
balance-=total;
}else{
balance+=total;
}
document.getElementById('result').innerText=
type+' آزمایشی: '+total.toFixed(2)+' دلار';
document.getElementById('balance').innerText=
'موجودی آزمایشی: '+balance.toFixed(2)+' دلار';
let h=document.getElementById('history');
if(h.innerText==='هنوز معامله‌ای انجام نشده')h.innerText='';
h.innerHTML='<p>'+type+' | قیمت: '+p+' | مقدار: '+a+
' | مبلغ: '+total.toFixed(2)+' دلار</p>'+h.innerHTML;
}
</script>
<script>
async function loadCryptoPrice() {
  const url = "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd";
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error("API error");
    const data = await response.json();

    let box = document.getElementById("realPrices");
    if (!box) {
      box = document.createElement("div");
      box.id = "realPrices";
      box.style.cssText =
        "background:#1e293b;padding:15px;margin:15px;border-radius:12px;color:white";
      document.body.appendChild(box);
    }

    box.innerHTML =
      "<h3>قیمت لحظه‌ای ارزها (دلار)</h3>" +
      "<p>بیت‌کوین: $" + data.bitcoin.usd.toLocaleString("en-US") + "</p>" +
      "<p>اتریوم: $" + data.ethereum.usd.toLocaleString("en-US") + "</p>" +
      "<small>قیمت ممکن است با تأخیر به‌روزرسانی شود.</small>";
  } catch (error) {
    console.error(error);
    alert("دریافت قیمت ناموفق بود؛ اتصال اینترنت یا محدودیت API را بررسی کن.");
  }
}
loadCryptoPrice();
setInterval(loadCryptoPrice, 60000);
</script>

</html>
