
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حسن ترید</title>
<style>
body{background:#101827;color:white;font-family:tahoma;text-align:center;padding:15px}
.card{background:#1e293b;padding:20px;border-radius:15px;margin:15px 0}
input,button{padding:13px;margin:7px;border:0;border-radius:8px;font-size:16px}
input{width:80%;box-sizing:border-box}
button{color:white;background:#16a34a}
.sell{background:#dc2626}
p{font-size:16px}
</style>
</head>
<body>
<h1>💹 حسن ترید</h1>
<p>قیمت بازار + معاملات آزمایشی</p>

<div class="card">
<h3>قیمت ارزها</h3>
<div id="realPrices">در حال دریافت قیمت...</div>
<button onclick="loadCryptoPrice()">به‌روزرسانی قیمت</button>
</div>

<div class="card">
<h3>معامله آزمایشی</h3>
<label>قیمت ارز (دلار):</label><br>
<input id="price" type="number" min="0" step="any" placeholder="قیمت را وارد کن"><br>
<label>مقدار ارز:</label><br>
<input id="amount" type="number" min="0" step="any" placeholder="مثلاً 0.01"><br>
<button onclick="trade('خرید')">خرید آزمایشی</button>
<button class="sell" onclick="trade('فروش')">فروش آزمایشی</button>
<p id="result">آماده شروع معامله</p>
<p id="balance">موجودی آزمایشی: 10000 دلار</p>
</div>

<div class="card">
<h3>تاریخچه معاملات</h3>
<div id="history">هنوز معامله‌ای انجام نشده</div>
</div>

<script>
let balance = 10000;
let isLoadingPrices = false;

// کلید Demo API خودت را اینجا قرار بده
const apiKey = 'CG-GcskhXqAYcK2Pq5JEVZzdZmh';

async function loadCryptoPrice() {
  const box = document.getElementById('realPrices');
  if (isLoadingPrices) return;

  isLoadingPrices = true;
  box.textContent = 'در حال دریافت قیمت واقعی...';

  try {
    const url =
      'https://api.coingecko.com/api/v3/simple/price' +
      '?ids=bitcoin,ethereum,solana' +
      '&vs_currencies=usd&include_24hr_change=true';

    const response = await fetch(url, {
      headers: {'x-cg-demo-api-key': apiKey.trim()}
    });

    if (!response.ok) {
      if (response.status === 401)
        throw new Error('کلید API نامعتبر است (401)');
      if (response.status === 403)
        throw new Error('دسترسی API رد شد (403)');
      if (response.status === 429)
        throw new Error('محدودیت درخواست (429)');
      throw new Error('خطای سرور: ' + response.status);
    }

    const data = await response.json();
    const coins = [
      ['بیت‌کوین','bitcoin'],
      ['اتریوم','ethereum'],
      ['سولانا','solana']
    ];

    const fragment = document.createDocumentFragment();

    for (const [name,id] of coins) {
      const coin = data[id];
      if (!coin || typeof coin.usd !== 'number')
        throw new Error('قیمت دریافت نشد');

      const p = document.createElement('p');
      p.textContent = name + ': $' +
        coin.usd.toLocaleString('en-US',
          {maximumFractionDigits:8});
      fragment.appendChild(p);

      if (typeof coin.usd_24h_change === 'number') {
        const change = document.createElement('small');
        change.textContent = 'تغییر ۲۴ ساعته: ' +
          coin.usd_24h_change.toFixed(2) + '%';
        fragment.appendChild(change);
        fragment.appendChild(document.createElement('br'));
      }
    }

    const time = document.createElement('p');
    time.textContent = 'آخرین دریافت: ' +
      new Date().toLocaleTimeString('fa-IR');
    fragment.appendChild(time);
    box.replaceChildren(fragment);

  } catch (error) {
    console.error(error);
    box.textContent = error.message;
  } finally {
    isLoadingPrices = false;
  }
}

function trade(type) {
  const p = Number(document.getElementById('price').value);
  const a = Number(document.getElementById('amount').value);

  if (!Number.isFinite(p) || !Number.isFinite(a) ||
      p <= 0 || a <= 0) {
    alert('قیمت و مقدار معتبر وارد کن');
    return;
  }

  const total = p * a;

  if (!Number.isFinite(total) || !Number.isFinite(balance)) {
    alert('مبلغ معامله معتبر نیست');
    return;
  }

  if (type === 'خرید') {
    if (total > balance) {
      alert('موجودی آزمایشی کافی نیست');
      return;
    }
    balance -= total;
  } else {
    balance += total;
  }

  document.getElementById('result').textContent =
    type + ' آزمایشی: ' + total.toFixed(2) + ' دلار';

  document.getElementById('balance').textContent =
    'موجودی آزمایشی: ' + balance.toFixed(2) + ' دلار';

  const history = document.getElementById('history');

  if (history.textContent === 'هنوز معامله‌ای انجام نشده')
    history.textContent = '';

  const row = document.createElement('p');
  row.textContent = type + ' | قیمت: ' + p +
    ' | مقدار: ' + a + ' | مبلغ: ' +
    total.toFixed(2) + ' دلار';

  history.prepend(row);
}

loadCryptoPrice();
setInterval(loadCryptoPrice, 60000);
</script>
</body>
</html>
